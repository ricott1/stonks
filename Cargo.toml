[package]
name = "stonks"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.95"
async-trait = "0.1.85"
clap = { version = "4.5.26", features = ["derive"] }
crossterm = "0.28.1"
directories = "6.0.0"
futures = "0.3.31"
image = "0.25.5"
include_dir = "0.7.4"
itertools = "0.14.0"
log = "0.4.25"
log4rs = "1.3.0"
once_cell = "1.20.2"
rand = "0.8.5"
rand_chacha = "0.3.1"
rand_distr = "0.4.3"
ratatui = { version = "0.29.0", features = ["unstable-backend-writer"] }
russh = "0.49.2"
russh-keys = "0.49.2"
serde = "1.0.217"
serde_json = "1.0.135"
sha2 = "0.10.8"
strum = "0.26.2"
strum_macros = "0.26.4"
tokio = "1.43.0"
tokio-util = "0.7.13"
uuid = { version = "1.12.1", features = ["serde","v4", "fast-rng"]}
