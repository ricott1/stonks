[package]
name = "stonks"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
image = "0.25.10"
include_dir = "0.7.4"
itertools = "0.14.0"
log = "0.4.29"
log4rs = "1.4.0"
once_cell = "1.21.4"
rand = "0.10.1"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
ratatui = { version = "0.30.0", features = ["unstable-backend-writer"] }
russh = "0.60.3"
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.10.8"
frittura-ssh-core = { git = "https://github.com/ricott1/frittura-ssh" }
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
tokio = "1.52.3"
tokio-util = "0.7.18"
uuid = { version = "1.23.1", features = ["serde", "v4", "fast-rng"] }
